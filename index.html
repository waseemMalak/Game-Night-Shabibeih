<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Shabibeh Game</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<!-- =========================
     SETUP SCREEN
========================== -->

<div id="setupScreen" class="screen">

    <div class="setup-card">

        <h1>Shabibeh Game</h1>

        <p class="subtitle">Game Setup</p>

        <div class="team-control">

            <button id="removeTeamBtn" class="team-btn">
                −
            </button>

            <div class="team-count">
                <span id="teamCount">2</span>
                <small>Teams</small>
            </div>

            <button id="addTeamBtn" class="team-btn">
                +
            </button>

        </div>

        <div id="teamList" class="team-list">
            <!-- Teams generated by JS -->
        </div>

        <button id="startGameBtn" class="start-btn">
            START GAME
        </button>

    </div>

</div>


<!-- =========================
     GAME SCREEN
========================== -->

<div id="gameScreen" class="screen hidden">

    <header class="game-header">

        <h1>SHABIBEH GAME</h1>

        <div id="currentTurn" class="current-turn">
            Team 1's Turn
        </div>

        <div id="scoreboard" class="scoreboard">
            <!-- Scores generated by JS -->
        </div>

    </header>


    <main id="gameBoard" class="game-board">
        <!-- Categories generated by JS -->
    </main>

</div>


<!-- =========================
     QUESTION MODAL
========================== -->

<div id="questionModal" class="modal hidden">

    <div class="question-card">

        <div class="question-header">

            <div>
                <span id="modalCategory" class="modal-category">
                    CATEGORY
                </span>

                <span id="modalPoints" class="modal-points">
                    100
                </span>
            </div>

            <button id="closeQuestionBtn" class="close-btn">
                ×
            </button>

        </div>


        <div class="question-body">

            <div id="answeringTeam" class="answering-team">
                Team 1
            </div>

            <p id="modalQuestion" class="question-text">
                Question goes here...
            </p>


            <!-- Answer is hidden until someone gets it correct -->

            <div id="answerContainer" class="answer-container hidden">

                <div class="answer-label">
                    ANSWER
                </div>

                <div id="modalAnswer" class="answer-text">
                    Answer
                </div>

            </div>

        </div>


        <!-- =========================
             HOST DECISION
        ========================== -->

        <div
            id="hostDecision"
            class="host-decision">

            <button
                id="correctBtn"
                class="correct-btn">
                ✓ CORRECT
            </button>

            <button
                id="wrongBtn"
                class="wrong-btn">
                ✕ WRONG
            </button>

        </div>

    </div>

</div>


<!-- =========================
     TEAM SELECTION MODAL
========================== -->

<div id="teamSelectionModal" class="modal hidden">

    <div class="team-selection-card">

        <div class="selection-header">
            <h2>WRONG ANSWER</h2>

            <button
                id="closeTeamSelectionBtn"
                class="close-btn">
                ×
            </button>
        </div>

        <div class="selection-body">

            <p>
                Choose a team to get the next chance.
            </p>

            <div
                id="availableTeams"
                class="available-teams">
                <!-- Teams generated by JS -->
            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>


</body>
</html>
